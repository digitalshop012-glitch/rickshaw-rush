name: 1 - Create signing key (run ONCE)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "ERROR: Add secret KEYSTORE_PASSWORD first"; exit 1; fi
          keytool -genkeypair -v -keystore upload.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Rickshaw Rush, OU=Games, O=Rickshaw Rush, L=India, C=IN"
          base64 -w0 upload.jks > upload.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-SAVE-THIS-SAFELY
          path: |
            upload.jks
            upload.jks.base64.txt
          retention-days: 3
