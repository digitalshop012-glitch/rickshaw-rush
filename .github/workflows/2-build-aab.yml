name: 2 - Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Set AdMob App ID and version
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>#" "$MANIFEST"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          echo "AdMob App ID used: $APP_ID"

      - name: Sync web files
        run: npx cap sync android

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign AAB
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "ERROR: Add secret KEYSTORE_BASE64 (see README)"; exit 1; fi
          echo "$KS_B64" | base64 -d > upload.jks
          cp android/app/build/outputs/bundle/release/app-release.aab rickshaw-rush.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            rickshaw-rush.aab upload
          jarsigner -verify rickshaw-rush.aab | tail -2

      - uses: actions/upload-artifact@v4
        with:
          name: rickshaw-rush-AAB
          path: rickshaw-rush.aab
